services:
  - type: web
    name: exam-ai-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: ALLOWED_ORIGINS
        value: https://smartstudent-ky69031f3-tranlocbtr99.vercel.app,https://smartstudent-94kq97cdo-tranlocb99.vercel.app,https://smartstudent-94kq97cdo-tranlocbtr99.vercel.app,https://smartstudent-omega.vercel.app,http://localhost:5173
      - key: FRONTEND_URL
        value: https://smartstudent-omega.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_URL
        value: https://smartstudent-omega.vercel.app
